name: Crear instalador de Kantinazo
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Kantinazo-Setup
          path: dist/Kantinazo-Setup-*.exe
